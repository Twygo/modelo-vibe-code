# Serve o build do React e proxia /api pro backend. Modelo: JPMO
# (Twygo/JPMO/frontend/nginx.conf) — mesmo par de arquivos, mesma razão de
# cada linha existir.

# Preserva o X-Forwarded-Proto que o Traefik (Dokploy) mandou. Este arquivo é
# incluído no contexto http, então o map pode viver aqui, fora do server.
# Acesso direto ao container (sem proxy na frente) cai no default $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de segurança básicos. Sem Content-Security-Policy de propósito:
    # é o header que mais quebra silenciosamente quando alguém troca de fonte,
    # de script externo ou de CDN — e "vibe coding" é exatamente o cenário em
    # que ninguém vai pensar em abrir o console pra descobrir por quê. Se o
    # seu projeto precisar de CSP, adicione aqui.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tudo que é API vai pro backend. Uma origem só (o browser fala com este
    # nginx, não com o backend direto) — é o que deixa o projeto sem CORS.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        include /etc/nginx/conf.d/proxy.inc;
    }

    # SPA: qualquer rota que não é arquivo nem API cai no index.html, e o
    # react-router decide o resto no navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
