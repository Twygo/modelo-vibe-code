services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kpi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kpi}
      POSTGRES_DB: ${POSTGRES_DB:-kpidb}
    # Sem porta publicada: o backend fala com o banco pela rede interna do Docker.
    # Se precisar abrir o banco num cliente SQL (DBeaver, TablePlus...), descomente:
    # ports:
    #   - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kpi} -d ${POSTGRES_DB:-kpidb}"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Montada a partir das variáveis POSTGRES_* do .env (a senha fica num lugar só).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kpi}:${POSTGRES_PASSWORD:-kpi}@postgres:5432/${POSTGRES_DB:-kpidb}
      # Token da API da Twygo (opcional). Fica só no backend, nunca vai pro navegador.
      TWYGO_API_TOKEN: ${TWYGO_API_TOKEN:-}
    volumes:
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_TARGET: ${VITE_API_TARGET:-http://backend:8000}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts

volumes:
  postgres_data:
